services:
  - type: web
    name: miloo-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health/check
    autoDeploy: true
    envVars:
      # Spring Profile & Context
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_SERVLET_CONTEXT_PATH
        value: /

      # Database Configuration (Supabase PostgreSQL / External DB)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_MAX_POOL_SIZE
        value: "10"
      - key: SPRING_DATASOURCE_MIN_IDLE
        value: "2"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: SPRING_FLYWAY_ENABLED
        value: "true"
      - key: SPRING_FLYWAY_BASELINE_ON_MIGRATE
        value: "true"

      # Security & JWT Token Generation
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: JWT_REFRESH_EXPIRATION_MS
        value: "604800000"

      # Auth Activation
      - key: AUTH_ACTIVATION_BASE_URL
        sync: false
      - key: AUTH_ACTIVATION_TTL_HOURS
        value: "24"
      - key: AUTH_MOCK_EMAIL_ENABLED
        value: "false"

      # Cloud Storage (Options: cloudinary | r2 | s3)
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: STORAGE_MOCK_ENABLED
        value: "true"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: "miloo/users"

      # OTP Provider Configuration
      - key: OTP_TTL_MINUTES
        value: "5"
      - key: OTP_MOCK_ENABLED
        value: "false"
      - key: OTP_SMS_PROVIDER
        value: msg91
      - key: OTP_EMAIL_PROVIDER
        value: smtp
      - key: OTP_MAX_ATTEMPTS
        value: "5"

      # MSG91 SMS Provider
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MSG91_SENDER_ID
        value: "MILOO"

      # SMTP Email Provider
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "Miloo Dating"

      # CORS Allowed Origins
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: CORS_ALLOWED_METHODS
        value: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      - key: CORS_ALLOWED_HEADERS
        value: "*"

      # Logging
      - key: LOGGING_LEVEL_ROOT
        value: INFO
      - key: LOGGING_LEVEL_COM_MILOO
        value: INFO
