services:
  - type: web
    name: miloo-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Replace or set these in the Render Dashboard Environment tab
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: STORAGE_MOCK_ENABLED
        value: "true"
      - key: AUTH_ACTIVATION_BASE_URL
        sync: false
