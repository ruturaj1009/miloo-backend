server:
  port: ${PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/}
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:20}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:2}

spring:
  application:
    name: miloo-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/miloo_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:2}
      idle-timeout: ${SPRING_DATASOURCE_IDLE_TIMEOUT:300000}
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT:20000}

  jpa:
    open-in-view: ${SPRING_JPA_OPEN_IN_VIEW:false}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_HIBERNATE_FORMAT_SQL:false}
        default_schema: ${SPRING_JPA_HIBERNATE_DEFAULT_SCHEMA:public}

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 0
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
    schemas: ${SPRING_FLYWAY_SCHEMAS:public,auth_ctx,people_ctx,interaction_ctx,chat_ctx,ai_ctx}

  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:20MB}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.miloo: ${LOGGING_LEVEL_COM_MILOO:INFO}
    org.springframework.web: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}
    org.springframework.security: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}
    org.hibernate: ${LOGGING_LEVEL_ORG_HIBERNATE:INFO}
    org.flywaydb: ${LOGGING_LEVEL_ORG_FLYWAYDB:INFO}
  pattern:
    level: "%5p"
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
    dateformat: "yyyy-MM-dd HH:mm:ss.SSS"

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  auth:
    activation-base-url: ${AUTH_ACTIVATION_BASE_URL:http://localhost:8080/api/v1/auth/activate}
    activation-token-ttl-hours: ${AUTH_ACTIVATION_TTL_HOURS:24}
    mock-email-enabled: ${AUTH_MOCK_EMAIL_ENABLED:false} # Mock activation welcome email sending (distinct from OTP)
  storage:
    provider: ${STORAGE_PROVIDER:r2} # Options: r2 | s3 | cloudinary
    mock-enabled: ${STORAGE_MOCK_ENABLED:true} # Graceful fallback for local development
    r2:
      account-id: ${R2_ACCOUNT_ID:dummy_account}
      access-key: ${R2_ACCESS_KEY_ID:dummy_key}
      secret-key: ${R2_SECRET_ACCESS_KEY:dummy_secret}
      bucket-name: ${R2_BUCKET_NAME:miloo-media}
      public-domain: ${R2_PUBLIC_DOMAIN:https://pub-media.example.com}
    s3:
      region: ${AWS_REGION:us-east-1}
      access-key: ${AWS_ACCESS_KEY_ID:dummy_key}
      secret-key: ${AWS_SECRET_ACCESS_KEY:dummy_secret}
      bucket-name: ${AWS_S3_BUCKET_NAME:miloo-media}
      public-domain: ${AWS_S3_PUBLIC_DOMAIN:https://miloo-media.s3.amazonaws.com}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:dummy_cloud}
      api-key: ${CLOUDINARY_API_KEY:dummy_key}
      api-secret: ${CLOUDINARY_API_SECRET:dummy_secret}
      folder: ${CLOUDINARY_FOLDER:miloo/users}
  otp:
    ttl-minutes: ${OTP_TTL_MINUTES:5}
    mock-enabled: ${OTP_MOCK_ENABLED:false} # Mock OTP service (Twilio/MSG91/SMTP OTP) independently
    sms-provider: ${OTP_SMS_PROVIDER:msg91} # Options: twilio | msg91
    email-provider: ${OTP_EMAIL_PROVIDER:smtp} # Options: smtp
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:dummy_account_sid}
      auth-token: ${TWILIO_AUTH_TOKEN:dummy_auth_token}
      from-phone-number: ${TWILIO_FROM_PHONE_NUMBER:+15005550006}
    msg91:
      auth-key: ${MSG91_AUTH_KEY:dummy_msg91_auth_key}
      template-id: ${MSG91_TEMPLATE_ID:dummy_template_id}
      sender-id: ${MSG91_SENDER_ID:MILOO}
    smtp:
      host: ${SMTP_HOST:smtp.gmail.com}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:dummy_username}
      password: ${SMTP_PASSWORD:dummy_password}
      from-email: ${SMTP_FROM_EMAIL:info@miloo.app}
      from-name: ${SMTP_FROM_NAME:Miloo Dating}
      auth: true
      starttls: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:"*"}
    allowed-methods: ${CORS_ALLOWED_METHODS:"GET,POST,PUT,DELETE,OPTIONS,PATCH"}
    allowed-headers: ${CORS_ALLOWED_HEADERS:"*"}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

