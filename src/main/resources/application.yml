server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: miloo-backend
  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/miloo_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    schemas: public,auth_ctx,people_ctx,interaction_ctx,chat_ctx,ai_ctx

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  storage:
    r2:
      account-id: ${R2_ACCOUNT_ID:dummy_account}
      access-key: ${R2_ACCESS_KEY_ID:dummy_key}
      secret-key: ${R2_SECRET_ACCESS_KEY:dummy_secret}
      bucket-name: ${R2_BUCKET_NAME:miloo-media}
      public-domain: ${R2_PUBLIC_DOMAIN:https://pub-media.example.com}
      mock-enabled: ${R2_MOCK_ENABLED:true} # true by default for zero-friction local development
  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: "*"
